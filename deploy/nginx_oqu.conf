# «Оқу»: всё по HTTPS на адресе с сертификатом Let's Encrypt.
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name 130-17-21-59.sslip.io;

    ssl_certificate /etc/letsencrypt/live/130-17-21-59.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/130-17-21-59.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 45m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# Любой вход по HTTP (имя Fornex, IP, sslip) — на HTTPS-адрес.
# /.well-known/ оставлен для продления сертификата.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://130-17-21-59.sslip.io$request_uri;
    }
}
